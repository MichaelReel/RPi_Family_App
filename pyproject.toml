[project]
name = "rpi-family-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marshmallow>=4.3.0",
    "pyqt6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = true
